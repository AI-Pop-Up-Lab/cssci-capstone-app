name: Hotfix Backfill - Stage 2 (Vote Choice + Extended Frame)

# USA only. Splits the given weeks round-robin into up to MAX_CONTAINERS
# groups and runs one ACI container per non-empty group, all in parallel —
# this stage has no week-to-week dependency (each week's stage-1 biography
# panel already stands alone), unlike stage 1, so it's safe to fan out. Run
# hotfix-backfill-stage1.yml for these same weeks first; stage 2 will fail
# fast for any week that doesn't have a stage-1 snapshot yet (unless it is
# resuming from a saved vote-choice panel).
#
# resume=true reuses each week's saved vote-choice panel and generates only
# the rows whose vote is still empty, then runs the R MRP step. If a week has
# no saved vote-choice panel it falls back to full generation from the
# stage-1 biography panel.
#
# mrp_only=true skips the survey wave and runs just the R MRP step on each
# week's already-saved vote-choice panel (it fails fast for any week whose
# panel is missing). If both mrp_only and resume are true, mrp_only wins.
# Incomplete panels only log a warning — the completeness hard stop is
# disabled in hotfix_backfill_stage2.py.
#
# Container names include the run id, so several runs can be in flight at
# once, e.g. an MRP-only run for the finished weeks while a full run is still
# generating votes for the others.

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'ISO weeks to backfill, e.g. 2026-14,2026-15,2026-16 (any order — independent in stage 2, spread across parallel containers)'
        required: true
      force:
        description: 'Force rerun even if a week already has a stage-2 lock (true/false)'
        required: false
        default: 'false'
      mrp_only:
        description: 'Skip vote-choice generation; run only the R MRP step on each saved vote-choice panel (true/false)'
        required: false
        default: 'false'
      resume:
        description: 'Reuse each week''s saved vote-choice panel and generate only the rows still missing, then run MRP (falls back to full generation if no saved panel exists) (true/false)'
        required: false
        default: 'false'

jobs:
  stage2:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MAX_CONTAINERS: 11
      ACI_PREFIX: hotfix-s2-${{ github.run_id }}-${{ github.run_attempt }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
      AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      HOTFIX_FORCE: ${{ github.event.inputs.force }}
      HOTFIX_MRP_ONLY: ${{ github.event.inputs.mrp_only }}
      HOTFIX_RESUME: ${{ github.event.inputs.resume }}
      WEEKS_INPUT: ${{ github.event.inputs.weeks }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Split weeks into up to MAX_CONTAINERS groups
        run: |
          IFS=',' read -ra WEEKS <<< "$WEEKS_INPUT"
          declare -a WEEK_GROUPS
          for i in "${!WEEKS[@]}"; do
            idx=$(( i % MAX_CONTAINERS ))
            week="$(echo "${WEEKS[$i]}" | tr -d '[:space:]')"
            WEEK_GROUPS[$idx]="${WEEK_GROUPS[$idx]:+${WEEK_GROUPS[$idx]},}${week}"
          done
          n="${#WEEK_GROUPS[@]}"
          echo "n=$n" >> "$GITHUB_ENV"
          for i in "${!WEEK_GROUPS[@]}"; do
            echo "GROUP_$i=${WEEK_GROUPS[$i]}" >> "$GITHUB_ENV"
            echo "Group $i: ${WEEK_GROUPS[$i]}"
          done

      - name: Delete existing ACIs if present
        run: |
          for i in $(seq 0 $((MAX_CONTAINERS - 1))); do
            az container delete --resource-group "$RESOURCE_GROUP" --name "$ACI_PREFIX-$i" --yes || true
          done

      - name: Create ACI stage-2 workers (one per group, running in parallel)
        run: |
          for i in $(seq 0 $((n - 1))); do
            group_var="GROUP_$i"
            group="${!group_var}"
            if [ -z "$group" ]; then continue; fi
            echo "Launching container $i for weeks: $group"
            az container create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$ACI_PREFIX-$i" \
              --image "$ACR_LOGIN_SERVER/weekly-worker:latest" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --restart-policy Never \
              --location westeurope \
              --cpu 1 \
              --memory 32 \
              --command-line "python -m data_generation.hotfix_backfill_stage2_entry" \
              --environment-variables \
                ENV=production \
                HOTFIX_WEEKS="$group" \
                HOTFIX_FORCE="$HOTFIX_FORCE" \
                HOTFIX_MRP_ONLY="$HOTFIX_MRP_ONLY" \
                HOTFIX_RESUME="$HOTFIX_RESUME" \
                BLOB_CONTAINER_NAME=generated-data \
              --secure-environment-variables \
                AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
                AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" \
                AZURE_OPENAI_MODEL="$AZURE_OPENAI_MODEL" \
                AZURE_OPENAI_BASE_URL="$AZURE_OPENAI_BASE_URL" \
                COHERE_API_KEY="$COHERE_API_KEY" \
              --os-type Linux
          done

      - name: Wait for all ACIs to finish
        timeout-minutes: 720
        run: |
          : > /tmp/active_containers.txt
          for i in $(seq 0 $((n - 1))); do
            group_var="GROUP_$i"
            group="${!group_var}"
            if [ -z "$group" ]; then continue; fi
            echo "$i" >> /tmp/active_containers.txt
          done
          while [ -s /tmp/active_containers.txt ]; do
            : > /tmp/still_active.txt
            while read -r i; do
              STATE=$(az container show --resource-group "$RESOURCE_GROUP" --name "$ACI_PREFIX-$i" --query "containers[0].instanceView.currentState.state" --output tsv)
              echo "Container $i state: $STATE"
              if [ "$STATE" != "Terminated" ]; then
                echo "$i" >> /tmp/still_active.txt
              fi
            done < /tmp/active_containers.txt
            mv /tmp/still_active.txt /tmp/active_containers.txt
            if [ -s /tmp/active_containers.txt ]; then sleep 30; fi
          done

      - name: Check exit codes
        run: |
          overall=0
          for i in $(seq 0 $((n - 1))); do
            group_var="GROUP_$i"
            group="${!group_var}"
            if [ -z "$group" ]; then continue; fi
            EXIT_CODE=$(az container show --resource-group "$RESOURCE_GROUP" --name "$ACI_PREFIX-$i" --query "containers[0].instanceView.currentState.exitCode" --output tsv)
            echo "Container $i (weeks: $group) exit code: $EXIT_CODE"
            if [ "$EXIT_CODE" != "0" ]; then overall=1; fi
          done
          if [ "$overall" != "0" ]; then
            echo "One or more stage-2 containers failed — see logs above/below."
            exit 1
          fi

      - name: Print container logs
        if: always()
        run: |
          for i in $(seq 0 $((MAX_CONTAINERS - 1))); do
            echo "=== Logs: $ACI_PREFIX-$i ==="
            az container logs --resource-group "$RESOURCE_GROUP" --name "$ACI_PREFIX-$i" || true
          done

      - name: Clean up ACIs
        if: always()
        run: |
          for i in $(seq 0 $((MAX_CONTAINERS - 1))); do
            az container delete --resource-group "$RESOURCE_GROUP" --name "$ACI_PREFIX-$i" --yes || true
          done
