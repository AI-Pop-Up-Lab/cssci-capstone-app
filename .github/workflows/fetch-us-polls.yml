name: Fetch US Polls (Stan model -> blob)

on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'Also store a dated archive copy of the output'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  fetch-us-polls:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete existing ACI if present
        run: |
          az container delete \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name fetch-us-polls \
            --yes || true

      - name: Create and run ACI worker
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name fetch-us-polls \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/weekly-worker:latest \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --restart-policy Never \
            --location westeurope \
            --cpu 4 \
            --memory 8 \
            --command-line "python -m data_generation.fetch_us_polls" \
            --environment-variables \
              ENV=production \
              US_POLLS_BLOB_CONTAINER="us-pollster-data" \
              US_POLLS_OUTPUT_BLOB_NAME="us_pollster_model_output.json" \
              US_POLLS_ARCHIVE="${{ github.event.inputs.archive }}" \
            --secure-environment-variables \
              AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --os-type Linux

      - name: Wait for ACI to finish
        run: |
          while true; do
            STATE=$(az container show \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name fetch-us-polls \
              --query "containers[0].instanceView.currentState.state" \
              --output tsv)
            echo "Container state: $STATE"
            if [ "$STATE" = "Terminated" ]; then break; fi
            sleep 15
          done

      - name: Check exit code
        run: |
          EXIT_CODE=$(az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name fetch-us-polls \
            --query "containers[0].instanceView.currentState.exitCode" \
            --output tsv)
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "US polls fetch failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Print container logs
        if: always()
        run: |
          az container logs \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name fetch-us-polls

      - name: Clean up ACI
        if: always()
        run: |
          az container delete \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name fetch-us-polls \
            --yes
