name: Hotfix Backfill - Stage 1 (Attrition + Biography)

# USA only. Runs a single ACI container that processes the given weeks
# strictly in order — each week's attrition step depends on the previous
# week's output, so this stage is never parallelized. Pair with
# hotfix-backfill-stage2.yml (survey + MRP extended frame), which runs
# after this and IS parallelized, since it has no such week-to-week
# dependency.

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'ISO weeks to backfill, OLDEST FIRST, e.g. 2026-14,2026-15,2026-16 (order matters — each week attrites off the previous)'
        required: true
      force:
        description: 'Force rerun even if a week already has a stage-1 lock (true/false)'
        required: false
        default: 'false'

jobs:
  stage1:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete existing ACI if present
        run: |
          az container delete \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name hotfix-backfill-stage1-aci \
            --yes || true

      - name: Create and run ACI stage-1 worker
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name hotfix-backfill-stage1-aci \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/weekly-worker:latest \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --restart-policy Never \
            --location westeurope \
            --cpu 2 \
            --memory 4 \
            --command-line "python -m data_generation.hotfix_backfill_stage1_entry" \
            --environment-variables \
              ENV=production \
              HOTFIX_WEEKS="${{ github.event.inputs.weeks }}" \
              HOTFIX_FORCE="${{ github.event.inputs.force }}" \
              BLOB_CONTAINER_NAME=generated-data \
            --secure-environment-variables \
              AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              AZURE_OPENAI_MODEL="${{ secrets.AZURE_OPENAI_MODEL }}" \
              AZURE_OPENAI_BASE_URL="${{ secrets.AZURE_OPENAI_BASE_URL }}" \
              COHERE_API_KEY="${{ secrets.COHERE_API_KEY }}" \
            --os-type Linux

      - name: Wait for ACI to finish
        timeout-minutes: 720
        run: |
          while true; do
            STATE=$(az container show \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name hotfix-backfill-stage1-aci \
              --query "containers[0].instanceView.currentState.state" \
              --output tsv)
            echo "Container state: $STATE"
            if [ "$STATE" = "Terminated" ]; then break; fi
            sleep 30
          done

      - name: Check exit code
        run: |
          EXIT_CODE=$(az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name hotfix-backfill-stage1-aci \
            --query "containers[0].instanceView.currentState.exitCode" \
            --output tsv)
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Stage 1 failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Print container logs
        if: always()
        run: |
          az container logs \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name hotfix-backfill-stage1-aci

      - name: Clean up ACI
        if: always()
        run: |
          az container delete \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name hotfix-backfill-stage1-aci \
            --yes
